name: BugTwin notebook smoke
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install smoke-test dependencies
        run: python -m pip install pandas numpy scikit-learn
      - name: Execute notebook in offline smoke mode
        env:
          BUGTWIN_CI: "1"
          BUGTWIN_SKIP_INSTALL: "1"
        run: |
          python - <<'PYCODE'
          import json
          with open("BugTwin.ipynb", encoding="utf-8") as stream:
              notebook = json.load(stream)
          scope = {}
          for cell in notebook["cells"]:
              if cell["cell_type"] == "code":
                  exec(compile("".join(cell["source"]), "BugTwin.ipynb", "exec"), scope)
          print("Offline notebook smoke passed")
          PYCODE
